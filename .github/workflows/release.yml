name: Release Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  
jobs:
  release:
    name: Build and Release

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: ubuntu-22.04
            arch: x64
            args: ""

          # Linux ARM64 (Orange Pi)
          - platform: ubuntu-22.04-arm
            arch: arm64
            args: ""

          # Windows x86_64
          - platform: windows-latest
            arch: x64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Pigeon/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Pigeon/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install npm packages
        working-directory: Pigeon
        run: npm ci

      - name: Create Rust secrets
        shell: bash
        run: |
          cat > Pigeon/src-tauri/src/secrets.rs <<'EOF'
          ${{ secrets.RUST_SECRETS }}
          EOF

      - name: Create TypeScript secrets
        shell: bash
        run: |
          cat > Pigeon/src/secrets.ts <<'EOF'
          ${{ secrets.TS_SECRETS }}
          EOF

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Pigeon
          tagName: ${{ github.ref_name }}
          releaseName: Release ${{ github.ref_name }}
          releaseBody: Automated release built via GitHub Actions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}