name: Release Tauri App

on:
  push:
    tags:
      - "v*"

jobs:
  release-linux:
    name: Build and Release (Linux)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive 
    
    permissions:
      contents: write 
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: ''                                   # Standard x86_64 Linux
          - args: '--target aarch64-unknown-linux-gnu' # ARM64 Linux (Orange Pi)

    steps:
      - name: Install basic tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y sudo git curl wget build-essential ca-certificates tzdata

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Pigeon/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install npm packages
        working-directory: Pigeon
        run: npm ci

      - name: Create Rust secrets
        shell: bash 
        run: |
          cat > Pigeon/src-tauri/src/secrets.rs <<'EOF'
          ${{ secrets.RUST_SECRETS }}
          EOF

      - name: Create TypeScript secrets
        shell: bash
        run: |
          cat > Pigeon/src/secrets.ts <<'EOF'
          ${{ secrets.TS_SECRETS }}
          EOF

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Pigeon 
          tagName: ${{ github.ref_name }} 
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "Automated release built via GitHub Actions."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-windows-mac:
    name: Build and Release (Windows & Mac)
    runs-on: ${{ matrix.platform }}
    
    permissions:
      contents: write 
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          # - platform: 'macos-latest'
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest'
          #   args: '--target x86_64-apple-darwin'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Pigeon/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install npm packages
        working-directory: Pigeon
        run: npm ci

      - name: Create Rust secrets
        shell: bash 
        run: |
          cat > Pigeon/src-tauri/src/secrets.rs <<'EOF'
          ${{ secrets.RUST_SECRETS }}
          EOF

      - name: Create TypeScript secrets
        shell: bash
        run: |
          cat > Pigeon/src/secrets.ts <<'EOF'
          ${{ secrets.TS_SECRETS }}
          EOF

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Pigeon 
          tagName: ${{ github.ref_name }} 
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "Automated release built via GitHub Actions."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}